<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Principal - UIA Sport GYM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px 0;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background-color: #DEA41E;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      text-decoration: none;
    }

    .button:hover {
      background-color: #c38e18;
    }

    .logout {
      margin-top: 30px;
      color: #555;
      font-size: 14px;
    }

    .logout a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .logout a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bienvenido al Sistema<br>UIA Sport GYM</h1>

    <a href="informacion_atleta.html" class="button">Información del Atleta</a>
    <a href="Reservaciones.html" class="button">Reservaciones</a>
    <a href="php/historial_reservas.php" class="button">Historial de Reservas</a>

    <div class="logout">
      <p>¿Deseas cerrar sesión? <a id="cerrarSesion">Cerrar sesión</a></p>
    </div>
  </div>

  <script>
    document.getElementById("cerrarSesion").addEventListener("click", function() {
      // Eliminar datos guardados en el navegador (opcional)
      sessionStorage.clear();
      localStorage.clear();

      // Redirigir al login
      window.location.href = "Login.html";
    });
  </script>

</body>
</html>
