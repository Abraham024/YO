<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservar Servicio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f9fafb, #e0f2fe);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      margin-top: 20px;
      display: block;
      color: #374151;
    }

    input[type="text"],
    input[type="date"],
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    input:focus,
    input:hover {
      outline: none;
      border-color: #2563eb;
    }

    button {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .catalogo {
      margin-top: 50px;
    }

    .catalogo h3 {
      color: #1e40af;
      text-align: center;
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .card {
      background-color: #f3f4f6;
      border-radius: 10px;
      padding: 15px 20px;
      width: 160px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card span {
      font-size: 16px;
      color: #111827;
      font-weight: 500;
    }

    .note {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reservar Servicio</h2>

    <form action="php/reservar.php" method="POST">
      <label for="servicios">Tipo de Servicio:</label>
      <input type="text" name="servicios" id="servicios" placeholder="Ej: Yoga, Zumba, etc." required />

      <label for="fecha_reserva">Fecha de Reservación:</label>
      <input type="date" id="fecha_reserva" name="fecha_reserva" required />

      <button type="submit">Reservar</button>
</form>

    </form>

    <div class="catalogo">
      <h3>Catálogo de Servicios</h3>
      <div class="cards">
        <div class="card"><span>Clases de Baile</span></div>
        <div class="card"><span>Zumba</span></div>
        <div class="card"><span>Stepdance</span></div>
        <div class="card"><span>Yoga</span></div>
        <div class="card"><span>Pilates</span></div>
        <div class="card"><span>Planes de Nutrición</span></div>
      </div>
      <p class="note">* Escriba el nombre del servicio tal como aparece para reservar correctamente.</p>
    </div>
  </div>
</body>
</html>
